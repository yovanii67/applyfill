<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ApplyFill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hero">
      <span class="face" aria-hidden="true">
        <span class="antenna"></span>
        <span class="eye left"></span>
        <span class="eye right"></span>
        <span class="mouth"></span>
      </span>
      <div>
        <p class="kicker">Internship autofill</p>
        <h1>ApplyFill</h1>
      </div>
    </header>

    <button id="fill" type="button">Fill this page</button>
    <p id="status" class="status">Saves your name, email, school, and the rest — then types them into the blanks.</p>

    <section class="meta">
      <div>
        <span>Profile</span>
        <strong id="complete">0 / 0</strong>
      </div>
      <div>
        <span>Shortcut</span>
        <strong>Alt + Shift + F</strong>
      </div>
    </section>

    <ul id="log" class="log" hidden></ul>

    <footer>
      <a href="options.html" target="_blank">Edit profile</a>
      <a href="../demo/application.html" target="_blank">Practice form</a>
      <a href="../demo/tesla.html" target="_blank">Tesla practice</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
